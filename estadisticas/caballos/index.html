function tablaOrdenable(cfg){
  let sk=cfg.sortKey, sd=cfg.sortDir;
  const tipo={}; cfg.cols.forEach(c=>tipo[c.k]=c.type);
  const ths=document.querySelectorAll('#'+cfg.tableId+' thead th[data-k]');
  const q=document.getElementById(cfg.searchId);
  function pintar(){
    const term=(q.value||'').trim().toLowerCase();
    let d=cfg.data.filter(x=>cfg.buscar(x).toLowerCase().includes(term));
    d.sort((a,b)=>{
      const x=a[sk], y=b[sk];
      if(tipo[sk]==='text') return sd*String(x==null?'':x).localeCompare(String(y==null?'':y),'es');
      return sd*((x||0)-(y||0));
    });
    const shown=term?d:d.slice(0,cfg.top);
    document.getElementById(cfg.tbodyId).innerHTML=shown.map((x,i)=>cfg.fila(x,i,term)).join('');
    document.getElementById(cfg.footId).innerHTML=term?(d.length+' resultado(s)'):('Mostrando '+Math.min(cfg.top,d.length)+' de '+cfg.data.length+' '+cfg.unidad);
    ths.forEach(th=>{th.querySelector('.ar').textContent=(th.dataset.k===sk)?(sd>0?'▲':'▼'):'';});
    if(cfg.onPintar) cfg.onPintar(sk,sd);
  }
  ths.forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(k===sk){sd*=-1;} else {sk=k; sd=(tipo[k]==='text')?1:-1;}  // texto arranca asc, número desc
    pintar();
  }));
  q.addEventListener('input',pintar);
  pintar();
  return {ordenar:(k)=>{sk=k; sd=(tipo[k]==='text')?1:-1; pintar();}};
}
