function tablaOrdenable(cfg){
  let sk=cfg.sortKey, sd=cfg.sortDir, verTodas=false;
  const tipo={}; cfg.cols.forEach(c=>tipo[c.k]=c.type);
  const ths=document.querySelectorAll('#'+cfg.tableId+' thead th[data-k]');
  const q=document.getElementById(cfg.searchId);
  const vtId=cfg.tableId+'-vt';
  function pintar(){
    const term=(q.value||'').trim().toLowerCase();
    let d=cfg.data.filter(x=>cfg.buscar(x).toLowerCase().includes(term));
    d.sort((a,b)=>{
      const x=a[sk], y=b[sk];
      if(tipo[sk]==='text') return sd*String(x==null?'':x).localeCompare(String(y==null?'':y),'es');
      return sd*((x||0)-(y||0));
    });
    const full=term||verTodas;
    const shown=full?d:d.slice(0,cfg.top);
    document.getElementById(cfg.tbodyId).innerHTML=shown.map((x,i)=>cfg.fila(x,i,term)).join('');
    let foot;
    if(term) foot=d.length+' resultado(s)';
    else if(d.length>cfg.top) foot='Mostrando '+shown.length+' de '+d.length+' '+cfg.unidad+
      ' · <a href="#" id="'+vtId+'">'+(verTodas?'ver menos':'ver todas')+'</a>';
    else foot=d.length+' '+cfg.unidad;
    document.getElementById(cfg.footId).innerHTML=foot;
    const vt=document.getElementById(vtId);
    if(vt) vt.addEventListener('click',e=>{e.preventDefault();verTodas=!verTodas;pintar();});
    ths.forEach(th=>{th.querySelector('.ar').textContent=(th.dataset.k===sk)?(sd>0?'▲':'▼'):'';});
    if(cfg.onPintar) cfg.onPintar(sk,sd);
  }
  ths.forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.k;
    if(k===sk){sd*=-1;} else {sk=k; sd=(tipo[k]==='text')?1:-1;}  // texto arranca asc, número desc
    pintar();
  }));
  q.addEventListener('input',pintar);
  pintar();
  return {ordenar:(k)=>{sk=k; sd=(tipo[k]==='text')?1:-1; verTodas=false; pintar();},
          setData:(nd)=>{cfg.data=nd; sk=cfg.sortKey; sd=cfg.sortDir; verTodas=false; pintar();}};
}
